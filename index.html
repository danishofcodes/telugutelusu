<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu Chaduvuko</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', 'Rounded Mplus 1c', -apple-system, sans-serif;
            background: #f0f0f0;
            color: #4b4b4b;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---- NAV BAR ---- */
        .nav {
            display: flex; background: #fff;
            border-bottom: 2px solid #e5e5e5;
            position: sticky; top: 0; z-index: 10;
        }
        .nav button {
            flex: 1; padding: 14px 0; background: none; border: none;
            color: #afafaf; font-family: inherit;
            font-size: 15px; font-weight: 800; cursor: pointer;
            border-bottom: 3px solid transparent; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .nav button.active { color: #58cc02; border-bottom-color: #58cc02; }

        /* ---- PAGE CONTAINERS ---- */
        .page { display: none; padding: 16px; max-width: 580px; margin: 0 auto; padding-bottom: 100px; }
        .page.active { display: block; }

        /* ---- DUOLINGO BUTTONS ---- */
        .duo-btn {
            display: block; width: 100%; padding: 14px;
            border: none; border-radius: 16px;
            font-family: inherit; font-size: 16px; font-weight: 800;
            cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: all 0.1s;
            position: relative; top: 0;
        }
        .duo-btn:active { top: 3px; box-shadow: none !important; }
        .duo-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .duo-btn-green {
            background: #58cc02; color: #fff;
            box-shadow: 0 4px 0 #46a302;
        }
        .duo-btn-green:active { box-shadow: 0 1px 0 #46a302; }
        .duo-btn-blue {
            background: #1cb0f6; color: #fff;
            box-shadow: 0 4px 0 #1899d6;
        }
        .duo-btn-blue:active { box-shadow: 0 1px 0 #1899d6; }
        .duo-btn-orange {
            background: #ff9600; color: #fff;
            box-shadow: 0 4px 0 #e08600;
        }
        .duo-btn-orange:active { box-shadow: 0 1px 0 #e08600; }
        .duo-btn-white {
            background: #fff; color: #1cb0f6;
            border: 2px solid #e5e5e5;
            box-shadow: 0 4px 0 #e5e5e5;
        }
        .duo-btn-white:active { box-shadow: 0 1px 0 #e5e5e5; }
        .duo-btn-red {
            background: #ff4b4b; color: #fff;
            box-shadow: 0 4px 0 #e04343;
        }

        /* ---- MODE TOGGLE ---- */
        .mode-bar {
            display: flex; gap: 8px; margin-bottom: 16px;
        }
        .mode-pill {
            flex: 1; padding: 10px 8px;
            border-radius: 12px; border: 2px solid #e5e5e5;
            background: #fff; color: #afafaf;
            font-family: inherit; font-size: 13px; font-weight: 800;
            cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .mode-pill.active {
            border-color: #84d8ff; background: #ddf4ff; color: #1cb0f6;
        }

        /* ---- PROGRESS ---- */
        .progress-wrap {
            background: #e5e5e5; border-radius: 10px; height: 14px;
            margin-bottom: 6px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: #58cc02; border-radius: 10px;
            transition: width 0.5s ease;
        }
        .progress-labels {
            display: flex; justify-content: space-between;
            font-size: 13px; font-weight: 700; color: #afafaf;
            margin-bottom: 18px;
        }

        /* ---- QUIZ ROW ---- */
        .quiz-card {
            background: #fff; border-radius: 16px;
            border: 2px solid #e5e5e5;
            padding: 14px 16px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 12px;
        }
        .quiz-card .num {
            background: #e5e5e5; color: #afafaf;
            font-weight: 900; font-size: 12px;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .quiz-card .word-col { flex: 1; }
        .quiz-card .word-main {
            font-size: 17px; font-weight: 800; color: #4b4b4b;
        }
        .quiz-card .word-phonetic {
            font-size: 12px; font-weight: 600; color: #afafaf;
            margin-top: 2px; font-style: italic;
        }
        .quiz-card .answer-hint {
            font-size: 12px; font-weight: 700; margin-top: 4px;
            display: none;
        }
        .quiz-card .answer-hint.correct { color: #58cc02; display: block; }
        .quiz-card .answer-hint.wrong { color: #ff4b4b; display: block; }
        .quiz-card input {
            flex: 1.1; padding: 10px 14px;
            background: #f7f7f7; border: 2px solid #e5e5e5;
            border-radius: 12px; font-family: inherit;
            font-size: 15px; font-weight: 600; color: #4b4b4b;
            outline: none; transition: border-color 0.2s;
        }
        .quiz-card input:focus { border-color: #1cb0f6; background: #fff; }
        .quiz-card input.correct { border-color: #58cc02; background: #d7ffb8; }
        .quiz-card input.incorrect { border-color: #ff4b4b; background: #ffdfe0; }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn-row .duo-btn { flex: 1; }

        /* ---- CHECKPOINT ---- */
        .checkpoint { text-align: center; padding: 30px 10px; }
        .checkpoint .emoji { font-size: 64px; margin-bottom: 10px; }
        .checkpoint h2 { font-size: 24px; font-weight: 900; color: #4b4b4b; margin-bottom: 6px; }
        .checkpoint .score-big {
            font-size: 52px; font-weight: 900; margin: 12px 0;
        }
        .checkpoint .score-big.pass { color: #58cc02; }
        .checkpoint .score-big.fail { color: #ff4b4b; }
        .checkpoint p {
            color: #777; font-size: 15px; font-weight: 600;
            line-height: 1.7; margin-bottom: 24px;
        }
        .checkpoint .duo-btn { max-width: 300px; margin: 8px auto; }

        /* ---- FINISH ---- */
        .finish { text-align: center; padding: 30px 10px; }
        .finish .emoji { font-size: 72px; margin-bottom: 10px; }
        .finish h2 { font-size: 26px; font-weight: 900; color: #58cc02; }
        .finish p { color: #777; font-size: 16px; font-weight: 600; margin: 12px 0 24px; }
        .finish .duo-btn { max-width: 300px; margin: 0 auto; }

        /* ---- NOTES PAGE ---- */
        .notes-header {
            text-align: center; padding: 10px 0 16px;
        }
        .notes-header h2 {
            font-size: 22px; font-weight: 900; color: #4b4b4b;
        }
        .notes-header p { font-size: 13px; color: #afafaf; font-weight: 700; }

        .search-input {
            width: 100%; padding: 12px 16px;
            background: #fff; border: 2px solid #e5e5e5;
            border-radius: 14px; font-family: inherit;
            font-size: 15px; font-weight: 600; color: #4b4b4b;
            outline: none; margin-bottom: 16px;
        }
        .search-input:focus { border-color: #1cb0f6; }

        .pron-guide {
            background: #ddf4ff; border: 2px solid #84d8ff;
            border-radius: 14px; padding: 14px 16px;
            margin-bottom: 16px; font-size: 13px; font-weight: 600;
            color: #1899d6; line-height: 1.8;
        }
        .pron-guide b { color: #1478a7; }

        .block-header {
            padding: 12px 0 6px;
            font-size: 14px; font-weight: 900; color: #58cc02;
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 2px solid #e5e5e5;
            margin-top: 12px; margin-bottom: 8px;
        }

        .notes-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
        .note-row {
            display: flex; align-items: center;
            background: #fff; border: 2px solid #e5e5e5;
            border-radius: 12px; padding: 10px 14px; gap: 10px;
        }
        .note-row .n-idx {
            background: #e5e5e5; color: #afafaf;
            font-weight: 900; font-size: 11px;
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .note-row .n-en { flex: 1; font-weight: 800; font-size: 15px; color: #4b4b4b; }
        .note-row .n-right { text-align: right; flex: 1.2; }
        .note-row .n-te { font-weight: 800; font-size: 15px; color: #1cb0f6; }
        .note-row .n-ph { font-size: 11px; font-weight: 600; color: #afafaf; font-style: italic; }

        @media (min-width: 480px) {
            .notes-grid { grid-template-columns: 1fr 1fr; }
            .block-header { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

<div class="nav">
    <button id="nav-quiz" class="active" onclick="showPage('quiz')">📝 Quiz</button>
    <button id="nav-notes" onclick="showPage('notes')">📖 Notes</button>
</div>

<div class="page active" id="page-quiz">
    <div class="mode-bar">
        <button class="mode-pill active" id="mode-en" onclick="setMode('en2te')">English → Telugu</button>
        <button class="mode-pill" id="mode-te" onclick="setMode('te2en')">Telugu → English</button>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="pbar"></div></div>
    <div class="progress-labels">
        <span id="plabel-l"></span><span id="plabel-r"></span>
    </div>
    <div id="quiz-area"></div>
</div>

<div class="page" id="page-notes">
    <div class="notes-header">
        <h2>📖 Word Reference</h2>
        <p>Study these before each checkpoint!</p>
    </div>
    <div class="pron-guide">
        <b>Pronunciation Key:</b><br>
        <b>aa</b> = long 'a' (f<u>a</u>ther) &nbsp;·&nbsp;
        <b>ee</b> = long 'e' (s<u>ee</u>) &nbsp;·&nbsp;
        <b>oo</b> = long 'o' (f<u>oo</u>d)<br>
        <b>th</b> = soft dental 't' &nbsp;·&nbsp;
        <b>dh</b> = soft dental 'd' &nbsp;·&nbsp;
        <b>ch</b> = as in '<u>ch</u>air'<br>
        <b>sh</b> = as in '<u>sh</u>ip' &nbsp;·&nbsp;
        <b>zh</b> = retroflex 'l' &nbsp;·&nbsp;
        Stress is on <b>CAPS</b> syllable
    </div>
    <input type="text" class="search-input" id="search-box" placeholder="🔍 Search any word..." oninput="buildNotes()">
    <div id="notes-list"></div>
</div>

var TOTAL = W.length;
var PER_SET = 10;
var PER_CP = 30;
var PASS = 20;

var mode = "en2te";
var wi = 0;            // word index
var checked = false;
var cpScore = 0;
var cpDone = 0;

// ---- NAV ----
function showPage(n) {
    document.getElementById("page-quiz").className = "page" + (n==="quiz"?" active":"");
    document.getElementById("page-notes").className = "page" + (n==="notes"?" active":"");
    document.getElementById("nav-quiz").className = n==="quiz"?"active":"";
    document.getElementById("nav-notes").className = n==="notes"?"active":"";
    if (n==="notes") buildNotes();
}

function setMode(m) {
    mode = m;
    document.getElementById("mode-en").className = "mode-pill"+(m==="en2te"?" active":"");
    document.getElementById("mode-te").className = "mode-pill"+(m==="te2en"?" active":"");
    if (!checked) renderSet();
}

function updateProgress() {
    var pct = Math.min(100, Math.round((wi/TOTAL)*100));
    document.getElementById("pbar").style.width = pct+"%";
    document.getElementById("plabel-l").innerText = wi+" / "+TOTAL+" words";
    var cn = Math.floor(wi/PER_CP)+1;
    document.getElementById("plabel-r").innerText = "Checkpoint "+cn+" / "+Math.ceil(TOTAL/PER_CP);
}

// ---- RENDER SET ----
function renderSet() {
    var area = document.getElementById("quiz-area");
    area.innerHTML = "";
    if (wi >= TOTAL) { showFinish(); return; }

    var end = Math.min(wi+PER_SET, TOTAL);
    var words = W.slice(wi, end);
    updateProgress();

    for (var i=0; i<words.length; i++) {
        var w = words[i];
        var isEn2Te = (mode==="en2te");
        var label = isEn2Te ? w.en : w.te;
        var answer = isEn2Te ? w.te : w.en;
        var ph = isEn2Te ? "" : w.p;
        var phInput = isEn2Te ? "Type Telugu..." : "Type English...";

        var card = document.createElement("div");
        card.className = "quiz-card";

        // number badge
        var num = document.createElement("span");
        num.className = "num";
        num.textContent = wi+i+1;

        // left column
        var col = document.createElement("div");
        col.className = "word-col";

        var main = document.createElement("div");
        main.className = "word-main";
        main.textContent = label;
        col.appendChild(main);

        // show phonetic on the label side
        if (isEn2Te) {
            // in en→te mode, no phonetic on the English side
        } else {
            // in te→en mode, show phonetic under Telugu label
            var phEl = document.createElement("div");
            phEl.className = "word-phonetic";
            phEl.textContent = w.p;
            col.appendChild(phEl);
        }

        var hint = document.createElement("div");
        hint.className = "answer-hint";
        hint.id = "hint-"+i;
        hint.textContent = answer;
        col.appendChild(hint);

        // input
        var inp = document.createElement("input");
        inp.type = "text";
        inp.id = "inp-"+i;
        inp.placeholder = phInput;
        inp.autocomplete = "off";

        card.appendChild(num);
        card.appendChild(col);
        card.appendChild(inp);
        area.appendChild(card);
    }

    // buttons
    var btnRow = document.createElement("div");
    btnRow.className = "btn-row";

    var bc = document.createElement("button");
    bc.className = "duo-btn duo-btn-orange";
    bc.id = "bc";
    bc.textContent = "CHECK";
    bc.onclick = doCheck;

    var bn = document.createElement("button");
    bn.className = "duo-btn duo-btn-green";
    bn.id = "bn";
    bn.textContent = "NEXT →";
    bn.disabled = true;
    bn.onclick = doNext;

    btnRow.appendChild(bc);
    btnRow.appendChild(bn);
    area.appendChild(btnRow);

    checked = false;
    var f = document.getElementById("inp-0");
    if (f) f.focus();
}

function norm(s) { return s.toLowerCase().trim().replace(/[^a-z]/g,""); }

function doCheck() {
    if (checked) return;
    var end = Math.min(wi+PER_SET, TOTAL);
    var words = W.slice(wi, end);
    var sc = 0;

    for (var i=0; i<words.length; i++) {
        var w = words[i];
        var inp = document.getElementById("inp-"+i);
        var uv = norm(inp.value);
        var cv = (mode==="en2te") ? w.te : w.en;
        var acc = cv.toLowerCase().split("/");
        inp.readOnly = true;
        var ok = false;
        for (var j=0; j<acc.length; j++) {
            if (uv!=="" && norm(acc[j])===uv) { ok=true; break; }
        }
        var hint = document.getElementById("hint-"+i);
        if (ok) {
            inp.classList.add("correct");
            hint.className = "answer-hint correct";
            hint.textContent = "✓ " + cv;
            // In en→te mode also show phonetic on correct
            if (mode==="en2te") hint.textContent = "✓ " + cv + "  (" + w.p + ")";
            sc++;
        } else {
            inp.classList.add("incorrect");
            hint.className = "answer-hint wrong";
            hint.textContent = "✗ " + cv;
            if (mode==="en2te") hint.textContent = "✗ " + cv + "  (" + w.p + ")";
        }
    }

    cpScore += sc;
    cpDone += words.length;
    checked = true;
    document.getElementById("bc").disabled = true;
    document.getElementById("bn").disabled = false;
}

function doNext() {
    wi = Math.min(wi+PER_SET, TOTAL);
    if (cpDone >= PER_CP) { showCP(); }
    else if (wi >= TOTAL) { if (cpDone>0) showCP(); else showFinish(); }
    else renderSet();
}

function showCP() {
    var area = document.getElementById("quiz-area");
    area.innerHTML = "";
    updateProgress();

    var passed = cpScore >= PASS;
    var cpN = Math.ceil(wi/PER_CP);
    var div = document.createElement("div");
    div.className = "checkpoint";

    var emoji = document.createElement("div");
    emoji.className = "emoji";
    emoji.textContent = passed ? "🎉" : "📚";

    var h2 = document.createElement("h2");
    h2.textContent = "Checkpoint " + cpN;

    var sc = document.createElement("div");
    sc.className = "score-big " + (passed?"pass":"fail");
    sc.textContent = cpScore + " / " + cpDone;

    var p = document.createElement("p");
    var btn;

    if (passed) {
        p.innerHTML = "Amazing! You scored <b>"+cpScore+"</b> out of "+cpDone+"!<br>You need "+PASS+" to pass. You crushed it! 💪";
        btn = document.createElement("button");
        btn.className = "duo-btn duo-btn-green";
        if (wi>=TOTAL) { btn.textContent = "🏆 SEE RESULTS"; btn.onclick = showFinish; }
        else { btn.textContent = "CONTINUE →"; btn.onclick = function(){ cpScore=0; cpDone=0; renderSet(); }; }
    } else {
        p.innerHTML = "You scored <b>"+cpScore+"</b> out of "+cpDone+".<br>You need <b>"+PASS+"</b> to continue.<br>Study the words in <b>📖 Notes</b> tab, then retry!";
        btn = document.createElement("button");
        btn.className = "duo-btn duo-btn-red";
        btn.textContent = "RETRY THIS BLOCK";
        btn.onclick = function(){ wi-=cpDone; cpScore=0; cpDone=0; renderSet(); };
    }

    div.appendChild(emoji);
    div.appendChild(h2);
    div.appendChild(sc);
    div.appendChild(p);
    div.appendChild(btn);
    area.appendChild(div);
}

function showFinish() {
    var area = document.getElementById("quiz-area");
    area.innerHTML = "";
    var div = document.createElement("div");
    div.className = "finish";

    var emoji = document.createElement("div");
    emoji.className = "emoji";
    emoji.textContent = "🏆";

    var h2 = document.createElement("h2");
    h2.textContent = "Congratulations!";

    var p = document.createElement("p");
    p.textContent = "You completed all "+TOTAL+" words!";

    var btn = document.createElement("button");
    btn.className = "duo-btn duo-btn-green";
    btn.textContent = "START OVER";
    btn.onclick = function(){ wi=0; cpScore=0; cpDone=0; renderSet(); };

    div.appendChild(emoji);
    div.appendChild(h2);
    div.appendChild(p);
    div.appendChild(btn);
    area.appendChild(div);
}

// ---- NOTES ----
function buildNotes() {
    var list = document.getElementById("notes-list");
    var q = norm(document.getElementById("search-box").value);
    list.innerHTML = "";

    var grid = document.createElement("div");
    grid.className = "notes-grid";
    var bn = 0;

    for (var i=0; i<W.length; i++) {
        if (i % PER_CP === 0) {
            bn++;
            var hdr = document.createElement("div");
            hdr.className = "block-header";
            hdr.textContent = "Block "+bn+"  ·  Words "+(i+1)+"–"+Math.min(i+PER_CP,TOTAL);
            grid.appendChild(hdr);
        }
        var w = W[i];
        if (q && norm(w.en).indexOf(q)===-1 && norm(w.te).indexOf(q)===-1) continue;

        var row = document.createElement("div");
        row.className = "note-row";

        var idx = document.createElement("span");
        idx.className = "n-idx";
        idx.textContent = i+1;

        var en = document.createElement("span");
        en.className = "n-en";
        en.textContent = w.en;

        var right = document.createElement("div");
        right.className = "n-right";

        var te = document.createElement("div");
        te.className = "n-te";
        te.textContent = w.te;

        var ph = document.createElement("div");
        ph.className = "n-ph";
        ph.textContent = w.p;

        right.appendChild(te);
        right.appendChild(ph);

        row.appendChild(idx);
        row.appendChild(en);
        row.appendChild(right);
        grid.appendChild(row);
    }
    list.appendChild(grid);
}

window.onload = function(){ renderSet(); };
</script>
